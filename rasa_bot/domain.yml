version: "3.1"

intents:
  - greet
  - goodbye
  - identify_patient
  - check_feeling_good
  - check_feeling_bad
  - ask_time
  - ask_date
  - ask_medicine
  - ask_discharge
  - ask_nurse
  - ask_weather
  - emergency
  - call_nurse
  - affirm
  - deny
  - fallback
  - request_song
  - request_discussion
  - request_joke
  - silence_timeout

entities:
  - first_name
  - last_name
  - medicine

slots:
  first_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: first_name
  
  last_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: last_name
  
  patient_id:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  
  patient_full_name:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  
  patient_identified:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom
  
  asked_wellness:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom

  asked_emergency:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom
  
  asked_activity:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom
  
  emergency_handled:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom

actions:
  - action_get_time
  - action_get_date
  - action_get_medicine
  - action_get_discharge
  - action_get_weather
  - action_trigger_alert
  - action_call_nurse
  - action_identify_patient
  - action_play_song
  - action_tell_joke
  - action_session_start
  - action_ask_wellbeing
  - action_ask_help
  - action_propose_activity
  - action_handle_affirm
  - action_handle_deny
  - action_handle_silence_timeout

responses:

  # DÉBUT DE RONDE - SALUTATION INITIALE DU ROBOT
  
  utter_greet_initial:
    - text: "Bonsoir, c'est Pepper, je viens prendre soin de vous. Quel est votre nom ?"
  
  # SALUTATION
  
  utter_greet:
    - text: "Bonsoir, je suis MediBot. Quel est votre nom et prénom ?"
  
  utter_ask_name:
    - text: "Quel est votre nom et prénom, s'il vous plaît ?"
  
  utter_not_identified:
    - text: "Je ne vous ai pas encore identifié. Dites-moi votre nom et prénom, s'il vous plaît."

  # APRÈS IDENTIFICATION - DEMANDER COMMENT VA LE PATIENT
  
  utter_ask_wellbeing:
    - text: "Parfait ! Est-ce que vous allez bien ?"

  # PATIENT VA BIEN - PROPOSER CHANSON OU DISCUSSION
  
  utter_propose_activity:
    - text: "Parfait. Souhaitez-vous que je vous chante quelque chose ou préférez-vous discuter ?"

  utter_ask_questions:
    - text: "Avez-vous des questions à me poser ?"

  
  # FIN / REPOS
  
  utter_goodbye:
    - text: "Très bien. Reposez-vous bien et bonne nuit."

  
  # PATIENT VA MAL
  
  utter_ask_help:
    - text: "Je suis désolé de l'entendre. Souhaitez-vous que j'appelle l'équipe d'urgence ?"

  utter_calling_emergency:
    - text: "Je vais chercher quelqu'un tout de suite. Restez calme, je suis là."

  utter_propose_comfort:
    - text: "Souhaitez-vous que je vous raconte une blague ou que je vous mette une musique apaisante ?"

  
  # HEURE / DATE (temporaire texte)
  # (sera remplacé par actions Python)
  
  utter_time:
    - text: "Je vais vous dire l'heure dans un instant."

  utter_date:
    - text: "Je vais vous dire la date dans un instant."

 
  # MÉDICAMENTS (temporaire)

  utter_medicine:
    - text: "Je vérifie votre traitement et je reviens vers vous."


  # APPEL INFIRMIÈRE

  utter_call_nurse:
    - text: "D'accord, je vais prévenir une infirmière immédiatement."


  # URGENCE

  utter_emergency:
    - text: "C'est noté. Je vais chercher de l'aide tout de suite. Restez calme, je suis là."

  # PAS DE RÉPONSE

  utter_no_response:
    - text: "Je n'ai pas entendu de réponse, tout va bien ?"

  # FALLBACK

  utter_fallback:
    - text: "Je n'ai pas bien compris. Pouvez-vous répéter doucement s'il vous plaît ?"

# =================================================
# SYNONYMES D'ENTITÉS
# =================================================
# Normalise les variantes orthographiques des prénoms
# Toutes les variantes sont converties vers le nom officiel
# =================================================

forms: {}

e2e_actions: []

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
