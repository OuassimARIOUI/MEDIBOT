version: "3.1"

nlu:

# =================================================
# LOOKUP TABLE — MÉDICAMENTS
# =================================================
# Utilisée avec l'entité : medicine
# Liée à l'intent : ask_medicine
# Objectif : améliorer la reconnaissance
# =================================================

- lookup: medicine
  examples: |
    - doliprane
    - paracétamol
    - insuline
    - antibiotique
    - morphine
    - aspirine
    - ibuprofène
    - amoxicilline
    - tramadol
    - codéine

# =================================================
