version: "3.1"

rules:


# =============================================
# RÈGLE : Début de session - Robot parle en premier
# =============================================

- rule: debut de session robot parle
  conversation_start: true
  steps:
    - action: action_session_start


# =============================================
# RÈGLE : Identification obligatoire
# =============================================

- rule: identifier le patient
  steps:
    - intent: identify_patient
    - action: action_identify_patient
    - action: action_ask_wellbeing


# =============================================
# RÈGLE : Patient silencieux trop longtemps
# =============================================

- rule: silence prolonge du patient
  steps:
    - intent: silence_timeout
    - action: action_handle_silence_timeout


# =============================================
# RÈGLE : Patient va bien → proposer activité
# =============================================

- rule: patient va bien proposer activite
  steps:
    - intent: check_feeling_good
    - action: action_propose_activity


# =============================================
# RÈGLE : Patient va mal → proposer aide
# =============================================

- rule: patient va mal proposer aide
  steps:
    - intent: check_feeling_bad
    - action: action_ask_help


# =============================================
# RÈGLE : Patient dit OUI (contexte wellness = "ça va bien ?")
# =============================================

- rule: patient confirme wellness
  condition:
    - slot_was_set:
      - asked_wellness: true
  steps:
    - intent: affirm
    - action: action_handle_affirm


# =============================================
# RÈGLE : Patient dit NON (contexte wellness = "ça va bien ?")
# =============================================

- rule: patient refuse wellness
  condition:
    - slot_was_set:
      - asked_wellness: true
  steps:
    - intent: deny
    - action: action_handle_deny


# =============================================
# RÈGLE : Patient dit OUI (contexte urgence)
# =============================================

- rule: patient confirme urgence
  condition:
    - slot_was_set:
      - asked_emergency: true
  steps:
    - intent: affirm
    - action: action_handle_affirm


# =============================================
# RÈGLE : Patient dit NON (contexte urgence)
# =============================================

- rule: patient refuse urgence
  condition:
    - slot_was_set:
      - asked_emergency: true
  steps:
    - intent: deny
    - action: action_handle_deny


# =============================================
# RÈGLE : Patient dit NON (contexte activité)
# =============================================

- rule: patient refuse activite
  condition:
    - slot_was_set:
      - asked_activity: true
  steps:
    - intent: deny
    - action: action_handle_deny


# =============================================
# RÈGLE : Empêcher action après urgence gérée
# =============================================

- rule: bloquer apres urgence
  condition:
    - slot_was_set:
      - emergency_handled: true
  steps:
    - intent: check_feeling_bad
    - action: utter_goodbye


# =============================================
# RÈGLE : Patient veut chanson
# =============================================

- rule: patient veut chanson
  steps:
    - intent: request_song
    - action: action_play_song
    - action: utter_goodbye


# =============================================
# RÈGLE : Patient veut discuter
# =============================================

- rule: patient veut discuter
  steps:
    - intent: request_discussion
    - action: utter_ask_questions


# =============================================
# RÈGLE : Patient veut blague
# =============================================

- rule: patient veut blague
  steps:
    - intent: request_joke
    - action: action_tell_joke
    - action: utter_goodbye


# =============================================
# RÈGLE : Demande heure
# =============================================

- rule: demander heure
  steps:
    - intent: ask_time
    - action: action_get_time


# =============================================
# RÈGLE : Demande date
# =============================================

- rule: demander date
  steps:
    - intent: ask_date
    - action: action_get_date


# =============================================
# RÈGLE : Demande médicament
# =============================================

- rule: demander medicament
  steps:
    - intent: ask_medicine
    - action: action_get_medicine


# =============================================
# RÈGLE : Demande date de sortie
# =============================================

- rule: demander sortie
  steps:
    - intent: ask_discharge
    - action: action_get_discharge


# =============================================
# RÈGLE : Répondre aux salutations
# =============================================

- rule: repondre au bonjour
  steps:
    - intent: greet
    - action: utter_greet


# =============================================
# RÈGLE : Urgence toujours prioritaire
# =============================================

- rule: urgence toujours prioritaire
  steps:
    - intent: emergency
    - action: action_trigger_alert
    - action: utter_emergency


# =============================================
# RÈGLE : Appeler quelqu'un (non urgent)
# =============================================

- rule: appeler quelqu'un non urgent
  steps:
    - intent: call_nurse
    - action: action_call_nurse


# =============================================
# RÈGLE : Appel infirmière
# =============================================

- rule: appel infirmiere
  steps:
    - intent: ask_nurse
    - action: utter_call_nurse
    - action: action_call_nurse


# =============================================
# RÈGLE : Fallback
# =============================================

- rule: fallback patient
  steps:
    - intent: fallback
    - action: utter_fallback
