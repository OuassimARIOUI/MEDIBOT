version: "3.1"

rules:


# =============================================
# RÈGLE : Début de session - Robot parle en premier
# =============================================

- rule: debut de session robot parle
  conversation_start: true
  steps:
    - action: action_session_start


# =============================================
# RÈGLE : Identification obligatoire
# =============================================

- rule: identifier le patient
  steps:
    - intent: identify_patient
    - action: action_identify_patient
    - action: utter_ask_wellbeing


# =============================================
# RÈGLE : Répondre aux salutations
# =============================================

- rule: repondre au bonjour
  steps:
    - intent: greet
    - action: utter_greet


# =============================================
# RÈGLE : Urgence toujours prioritaire
# =============================================

- rule: urgence toujours prioritaire
  steps:
    - intent: emergency
    - action: action_trigger_alert
    - action: utter_emergency


# =============================================
# RÈGLE : Appel infirmière
# =============================================

- rule: appel infirmiere
  steps:
    - intent: ask_nurse
    - action: utter_call_nurse
    - action: action_trigger_alert


# =============================================
# RÈGLE : Fallback
# =============================================

- rule: fallback patient
  steps:
    - intent: fallback
    - action: utter_fallback
