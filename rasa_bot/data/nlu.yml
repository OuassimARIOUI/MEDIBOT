version: "3.1"

nlu:


# SALUTATIONS

- intent: greet
  examples: |
    - bonjour
    - bonsoir
    - salut
    - bonsoir robot
    - bonjour MediBot
    - hey
    - coucou


# CHOIX D'ACTIVITÉ

- intent: request_song
  examples: |
    - chanson
    - je veux une chanson
    - chante-moi quelque chose
    - tu peux me chanter quelque chose
    - mets de la musique
    - une chanson s'il te plaît
    - je voudrais écouter de la musique
    - oui une chanson
    - musique
    - mets-moi une musique apaisante

- intent: request_discussion
  examples: |
    - discuter
    - je veux discuter
    - parlons
    - je préfère discuter
    - oui discutons
    - j'ai des questions
    - je voudrais te poser des questions
    - parler

- intent: request_joke
  examples: |
    - blague
    - raconte-moi une blague
    - je veux une blague
    - oui une blague
    - dis-moi une blague
    - fais-moi rire
    - raconte quelque chose de drôle


# IDENTIFICATION PATIENT
# Note: L'action récupère dynamiquement les noms depuis la DB
# Ces exemples servent uniquement à entraîner l'intent

- intent: identify_patient
  examples: |
    - je suis pierre dupont
    - je suis dupont pierre
    - mon nom est marie martin
    - mon nom est martin marie
    - je m'appelle jean durand
    - je m'appelle durand jean
    - c'est sophie bernard
    - c'est bernard sophie
    - moi c'est paul moreau
    - je suis monsieur laurent philippe
    - madame claire benoit
    - bonjour je suis ahmed benali
    - bonsoir je suis fatima kaddour
    - ouassim arioui
    - asmaa boukraa
    - je suis ouassim arioui
    - je suis asmaa boukraa

- intent: goodbye
  examples: |
    - au revoir
    - bonne nuit
    - à plus tard
    - merci bonne nuit
    - tu peux partir
    - laisse-moi dormir


# ÉTAT DU PATIENT

- intent: check_feeling_good
  examples: |
    - ça va
    - je vais bien
    - tout va bien
    - ça va merci
    - je me sens bien
    - aucun problème

- intent: check_feeling_bad
  examples: |
    - ça ne va pas
    - je ne me sens pas bien
    - je vais mal
    - j'ai mal
    - je suis fatigué
    - je suis stressé
    - je suis inquiet
    - j'ai peur
    - je me sens mal


# DEMANDE HEURE / DATE

- intent: ask_time
  examples: |
    - quelle heure est-il
    - il est quelle heure
    - tu peux me dire l'heure
    - c'est quelle heure maintenant
    - donne-moi l'heure

- intent: ask_date
  examples: |
    - quel jour on est
    - on est quel jour
    - quelle est la date aujourd'hui
    - on est quelle date
    - c'est quel jour aujourd'hui


# DATE DE SORTIE

- intent: ask_discharge
  examples: |
    - je sors quand
    - quand je sors
    - je veux sortir
    - quelle est ma date de sortie
    - c'est quand ma sortie
    - quand est-ce que je peux partir
    - quand je peux rentrer chez moi
    - ma date de sortie
    - je rentre quand
    


# MÉDICAMENTS

- intent: ask_medicine
  examples: |
    - c'est quand ma prochaine dose
    - quand est-ce que je prends mon médicament
    - je dois prendre mon médicament quand
    - c'est l'heure de mon traitement
    - je prends quoi comme médicament
    - c'est quand le [doliprane](medicine)
    - quand je prends l'[insuline](medicine)
    - mon traitement c'est pour quand
    - je veux prendre [doliprane](medicine)
    - c'est quand je peux prendre mes médicaments
    - je peux prendre [insuline](medicine)
    - [paracétamol](medicine) c'est pour quand
    - mon [doliprane](medicine)
    - [aspirine](medicine) à quelle heure


# APPEL INFIRMIER

- intent: ask_nurse
  examples: |
    - peux-tu appeler l'infirmière
    - j'ai besoin d'une infirmière
    - appelle quelqu'un
    - j'ai besoin d'aide
    - pouvez-vous appeler une infirmière
    - je veux voir un soignant


# URGENCE

- intent: emergency
  examples: |
    - urgence
    - c'est urgent
    - c’est très urgent
    - j'ai besoin d'aide tout de suite
    - j'ai très mal
    - je ne vais pas bien du tout
    - je n'arrive pas à respirer
    - aidez-moi
    - appelez quelqu'un immédiatement
    - c'est grave
    - URGENT
    - SOS



# CONFIRMATION / REFUS

- intent: affirm
  examples: |
    - oui
    - oui s'il vous plaît
    - d'accord
    - ok
    - je veux bien
    - faites-le

- intent: deny
  examples: |
    - non
    - non merci
    - ça ira
    - pas besoin
    - laisse tomber
    - ce n'est pas nécessaire
    - noooo
    - non je veux juste me reposer
    - laisse-moi tranquille
    - je n'ai besoin de rien
